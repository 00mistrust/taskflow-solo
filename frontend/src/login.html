<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Connexion</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: white; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
    p { text-align: center; margin-top: 15px; }
    a { color: #4a90e2; text-decoration: none; }
    .error { color: red; text-align: center; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>TaskFlow 🚀</h2>
    <p class="error" id="error">Email ou mot de passe incorrect</p>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <p>Pas de compte ? <a href="register.html">S'inscrire</a></p>
  </div>
  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('error').style.display = 'block';
          return;
        }
        localStorage.setItem('token', data.token);
        window.location.href = 'dashboard.html';
      } catch (err) { console.error('Erreur login:', err); }
    }
  </script>
</body>
</html>
